name: GitOps Infrastructure Deployment

on:
 push:
   branches:
     - main
   paths:
     - 'project18-GitOps-Infra-Deployment/**'
     - '.github/workflows/gitops-apply.yml'

permissions:
 contents: read

jobs:
 plan:
   name: Terraform Plan
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Init
       run: terraform -chdir=project18-GitOps-Infra-Deployment init -backend=false

     - name: Terraform Plan
       run: terraform -chdir=project18-GitOps-Infra-Deployment plan -out=tfplan

     - name: Upload Plan
       uses: actions/upload-artifact@v4
       with:
         name: terraform-plan
         path: project18-GitOps-Infra-Deployment/tfplan

 apply:
   name: Terraform Apply
   needs: plan
   runs-on: ubuntu-latest
   environment: production

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Init
       run: terraform -chdir=project18-GitOps-Infra-Deployment init -backend=false

     - name: Download Plan
       uses: actions/download-artifact@v4
       with:
         name: terraform-plan
         path: project18-GitOps-Infra-Deployment

     - name: Terraform Apply
       run: terraform -chdir=project18-GitOps-Infra-Deployment apply -auto-approve tfplan