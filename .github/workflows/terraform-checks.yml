name: Terraform CI Validation

on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main

jobs:
 terraform-check:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Format
       run: terraform fmt -check -recursive

     - name: Terraform Validate
       run: |
         terraform -chdir=project-12-terraform-plan init
         terraform -chdir=project-12-terraform-plan validate

     - name: Terraform Plan
       run: |
         terraform -chdir=project-12-terraform-plan plan -out=tfplan
         terraform -chdir=project-12-terraform-plan show -no-color tfplan > plan.txt

     - name: Upload Terraform Plan
       uses: actions/upload-artifact@v4
       with:
         name: terraform-plan
         path: |
           project-12-terraform-plan/tfplan
           project-12-terraform-plan/plan.txt