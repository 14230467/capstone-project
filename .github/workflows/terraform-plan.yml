name: Terraform CI Plan

on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main

jobs:
 terraform-check:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Format
       run: terraform fmt -check -recursive

     - name: Terraform Validate
       run: |
         terraform -chdir=project12-Terraform-Plan init
         terraform -chdir=project12-Terraform-Plan validate

     - name: Terraform Plan
       run: |
         terraform -chdir=project12-Terraform-Plan plan -out=tfplan
         terraform -chdir=project12-Terraform-Plan show -no-color tfplan > plan.txt

     - name: Upload Terraform Plan
       uses: actions/upload-artifact@v4
       with:
         name: terraform-plan
         path: |
           project12-Terraform-Plan/tfplan
           project12-Terraform-Plan/plan.txt