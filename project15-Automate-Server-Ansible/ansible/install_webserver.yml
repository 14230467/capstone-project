---
- name: Install and configure Apache web server
 hosts: webservers
 become: yes

 tasks:
   - name: Update apt package cache
     apt:
       update_cache: yes
       cache_valid_time: 3600

   - name: Install Apache
     apt:
       name: apache2
       state: present

   - name: Ensure Apache is enabled and running
     service:
       name: apache2
       state: started
       enabled: yes

   - name: Deploy custom website
     copy:
       content: |
         <html>
         <head>
           <title>Ansible Project 15</title>
         </head>
         <body>
           <h1>Apache deployed using Ansible!</h1>
           <p>This web server was configured automatically.</p>
           <p>Project 15 - Infrastructure Automation</p>
         </body>
         </html>
       dest: /var/www/html/index.html
       mode: '0644'