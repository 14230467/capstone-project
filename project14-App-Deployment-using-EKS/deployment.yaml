apiVersion: apps/v1
kind: Deployment
metadata:
 name: capstone-app
spec:
 replicas: 2
 selector:
   matchLabels:
     app: capstone-app
 template:
   metadata:
     labels:
       app: capstone-app
   spec:
     containers:
       - name: capstone-app
         image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/capstone-docker-app:latest
         ports:
           - containerPort: 80